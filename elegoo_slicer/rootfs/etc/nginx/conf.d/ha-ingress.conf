# Home Assistant ingress listener.
#
# The base image's own listener on 3000 is fine for direct access and is left
# alone. This one exists because the Kasm web client cannot work out its own
# websocket URL behind a prefix. From app/ui.js:
#
#     url = UI.getSetting('encrypt') ? 'wss' : 'ws';
#     url += '://' + host;
#     if (port) { url += ':' + port; }
#     url += '/' + path;              // `path` defaults to "websockify"
#
# That is built from the ORIGIN, not from the page's location. Under ingress
# the page is served at /api/hassio_ingress/<token>/, so the client asks for
# ws://<home-assistant>/websockify — Home Assistant's own root, which has no
# such endpoint. The socket never opens, the client tears down UI.rfb, and its
# keep-alive timer then dies on `UI.rfb.lastActiveAt`. That TypeError is the
# symptom people see; this is the cause.
#
# The client does accept an explicit path through its query string, which is
# how the base image supports SUBFOLDER installs. SUBFOLDER is a static build
# -time value though, and the ingress token is neither static nor knowable at
# build time — so the path is injected per request, from the X-Ingress-Path
# header Home Assistant sends.

# "/api/hassio_ingress/<token>" -> "api/hassio_ingress/<token>/websockify".
# No leading slash: the client concatenates '/' + path itself.
map $http_x_ingress_path $kasm_ws_path {
    default                 "websockify";
    "~^/(?<ing>.*[^/])/?$"  "$ing/websockify";
}

# Diagnostics. Only the page request and the socket request are logged, so this
# stays a handful of lines per session rather than one per asset. Between them
# they answer: are requests reaching this listener at all (i.e. is this version
# running), what is Home Assistant actually sending as the prefix, and did the
# client ever go on to ask for the socket.
log_format elegoo_ingress '[elegoo-ingress] $request_method $uri '
                          'x_ingress_path="$http_x_ingress_path" '
                          'computed_ws_path="$kasm_ws_path" '
                          'upgrade="$http_upgrade" status=$status';

map $http_upgrade $kasm_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # IPv4 only, deliberately. Ingress connects over IPv4, and a `listen [::]`
    # here would abort nginx outright on a host without IPv6 — taking the whole
    # add-on with it. The base image strips such lines when DISABLE_IPV6 is set,
    # but it only rewrites its own config file, not this one.
    listen 8099 default_server;

    # The VNC transport. Home Assistant strips the ingress prefix before
    # forwarding, so what the browser addressed as
    # /api/hassio_ingress/<token>/websockify arrives here as plain /websockify.
    # Open this through the sidebar's own URL to see what this listener is
    # receiving:  http://<home-assistant>/api/hassio_ingress/<token>/__elegoo
    location = /__elegoo {
        default_type application/json;
        # Deliberately reports no version number. It used to carry one as a
        # literal, which meant it kept insisting it was 0.1.3 through every
        # release after — a diagnostic endpoint confidently reporting the wrong
        # thing is worse than one that reports less. The add-on's version is on
        # its Info tab; what cannot be seen from there is what follows.
        return 200 '{"listener":"ingress-8099","x_ingress_path":"$http_x_ingress_path","computed_ws_path":"$kasm_ws_path"}\n';
    }

    location /websockify {
        access_log /dev/stdout elegoo_ingress;
        proxy_pass              http://127.0.0.1:6901;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection $kasm_connection_upgrade;
        proxy_set_header        Host $http_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_buffering         off;
    }

    # Everything else is the web client itself, plus its file-manager and audio
    # sockets. Those build their paths from window.location.pathname, so they
    # survive the prefix on their own and need no help here.
    location / {
        access_log /dev/stdout elegoo_ingress;
        proxy_pass              http://127.0.0.1:6900;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection $kasm_connection_upgrade;
        proxy_set_header        Host $http_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_buffering         off;

        # sub_filter cannot rewrite a compressed body, so ask for none.
        proxy_set_header        Accept-Encoding "";

        # Hand the client the path it cannot derive. The page embeds the viewer
        # as <iframe src="vnc/index.html?...&show_control_bar=true">, and the
        # viewer reads `path` from its own query string.
        # Matched without the trailing quote on purpose: this has to survive a
        # kclient whose markup differs slightly from the copy this was written
        # against. Appending another query parameter is safe wherever it lands
        # inside the URL.
        sub_filter 'show_control_bar=true' 'show_control_bar=true&amp;path=$kasm_ws_path';

        # Let each device keep its own sizing. The client reads a setting from
        # the URL first and only then from the browser's own storage:
        #
        #     let val = WebUtil.getConfigVar(name);
        #     if (val === null) { val = WebUtil.readSetting(name, defVal); }
        #
        # so the hardcoded resize=remote in the page wins over anything chosen
        # in the client's Settings panel — a desktop and a phone cannot both be
        # right. Dropping it from the URL leaves the same default in place
        # (initSettings falls back to 'remote') while letting a phone switch to
        # Scale and have that stick for that browser only.
        sub_filter 'resize=remote&' '';

        # Allow browser zoom. Note this only takes effect on the published
        # port: a viewport meta applies to the top-level document, and in the
        # sidebar this page is inside Home Assistant's iframe, so Home
        # Assistant's viewport governs and this one is ignored. Kept because it
        # genuinely helps on the direct port, but it is not what makes a phone
        # usable through the sidebar — the default below is.
        sub_filter 'maximum-scale=1.0, user-scalable=no' 'maximum-scale=5.0, user-scalable=yes';

        # Give a touch device a sane starting size.
        #
        # The client's default is Remote Resizing, which makes the desktop the
        # size of the browser window. On a phone that yields a desktop a few
        # hundred pixels wide, and the slicer's own dialogs have minimum widths
        # larger than that — so their buttons sit off the edge of a screen that
        # cannot be scrolled or zoomed, which is a dead end on first launch.
        #
        # Local Scaling instead fits the whole desktop to the screen. Set as a
        # stored default rather than a URL parameter, because a URL parameter
        # beats the client's own Settings panel and would take the choice away
        # again.
        #
        # Guarded by a marker key, NOT by "is resize unset". The client persists
        # whatever it resolves — initSetting() ends with setSetting(name, val) —
        # so every visit made before this existed wrote resize="remote" into the
        # browser. An "only if unset" guard therefore never fires on the one
        # device that needs it: a phone that has already opened the panel. The
        # marker applies this once per browser regardless, and never again, so a
        # later explicit choice still survives.
        sub_filter '</head>' '<script>(function(){try{if(!localStorage.getItem("elegoo_touch_default_v1")){localStorage.setItem("elegoo_touch_default_v1","1");if(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches){localStorage.setItem("resize","scale");}}}catch(e){}})();</script></head>';

        sub_filter_once on;
    }
}
