configuration:
  web_username:
    name: Web username
    description: >-
      Username for the web interface login. Only used when a password is also
      set; defaults to "elegoo".
  web_password:
    name: Web password
    description: >-
      Password for the web interface. Leaving this empty means no login is
      required at all, so set it before mapping port 3000. The sidebar is
      authenticated by Home Assistant either way.
  resolution:
    name: Desktop size
    description: >-
      Starting size of the desktop, as WIDTHxHEIGHT. A desktop browser asks the
      server to match its window as soon as it connects, so this is mainly what
      a phone or tablet sees — big enough that the slicer's toolbars fit, and
      then pinch to zoom in. Default 1440x900.
  extra_folders:
    name: Extra folders for file dialogs
    description: >-
      Additional paths to offer down the side of the slicer's open/save
      dialogs. Everything mounted under /share and /media is added
      automatically, so a NAS attached in Settings > System > Storage already
      appears by name; use this only for somewhere else inside the add-on.
  slice_api_token:
    name: Slice API token
    description: >-
      Bearer token for the headless slicing API on port 8100. That port is
      only reachable from other add-ons and Home Assistant, never your LAN;
      leaving this empty lets any of them slice files under /share and /media.
  printer_host:
    name: Printer address
    description: >-
      IP address of the Centauri Carbon 2 the API uploads to and prints on.
  printer_serial:
    name: Printer serial number
    description: >-
      The printer's serial number (mainboard ID), as Home Assistant's Elegoo
      integration shows it.
  printer_access_code:
    name: Printer access code
    description: >-
      The access code from the printer's screen (Settings > Network). Used for
      uploads and for the MQTT commands that start prints.

network:
  3000/tcp: Desktop web interface for direct access, bypassing the sidebar. Unmapped by default - the desktop offers a file manager and a session on your Home Assistant host, so set a password before exposing it.
