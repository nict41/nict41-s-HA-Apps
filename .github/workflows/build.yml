name: Build

# `push` is restricted to the default branch on purpose. Without that, a
# branch with an open pull request fires this workflow twice - once for the
# push and once for the pull request - and every check runs in duplicate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede a run when another push lands on the same pull request. Runs on
# main are left alone: cancelling one would throw away the signal that the
# default branch still builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which images this change can actually affect. A `paths:` filter cannot
  # do this: it decides whether the workflow runs at all, not which matrix
  # entries run, so one app's config.yaml used to rebuild all of them.
  select:
    name: Select affected apps
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: select
        name: Work out which apps changed
        env:
          # A push to main and a manual run build everything: the point
          # there is to prove the whole repository still works.
          SELECT_ALL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "${SELECT_ALL}" = "true" ]; then
            printf '' | .github/scripts/select-matrix.sh | tee -a "${GITHUB_OUTPUT}"
          else
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              | tee /dev/stderr \
              | .github/scripts/select-matrix.sh | tee -a "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      # aarch64 images are built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The same two build args the Supervisor passes when it builds an app
      # on the machine it's installed on, with BUILD_FROM taken from the
      # app's own build.yaml - so this proves the real install-time build.
      - name: Build ${{ matrix.app }} for ${{ matrix.arch }}
        run: |
          build_from=$(yq -r '.build_from.${{ matrix.arch }}' "${{ matrix.app }}/build.yaml")
          echo "Building ${{ matrix.app }} for ${{ matrix.arch }} from ${build_from}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM="${build_from}" \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --output type=cacheonly \
            "${{ matrix.app }}"
