name: Build

# `push` is restricted to the default branch on purpose. Without that, a
# branch with an open pull request fires this workflow twice - once for the
# push and once for the pull request - and every check runs in duplicate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede a run when another push lands on the same pull request. Runs on
# main are left alone: cancelling one would throw away the signal that the
# default branch still builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which images this change can actually affect. A `paths:` filter cannot
  # do this: it decides whether the workflow runs at all, not which matrix
  # entries run, so one app's config.yaml used to rebuild all of them.
  select:
    name: Select affected apps
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: select
        name: Work out which apps changed
        env:
          # Only a manual run selects everything. A pull request and a push
          # to main both build just the apps their change touched: the pull
          # request already proved those, and rebuilding all the others on
          # every merge cost about an hour of runner time each.
          SELECT_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          # What the change is measured against: the pull request's base,
          # or the commit main pointed at before this push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a manual run, the first push of a branch, or a
          # force push that dropped the old commit): select everything
          # rather than guess.
          if [ "${SELECT_ALL}" != "true" ] \
              && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            SELECT_ALL=true
          fi
          if [ "${SELECT_ALL}" = "true" ]; then
            printf '' | .github/scripts/select-matrix.sh | tee -a "${GITHUB_OUTPUT}"
          else
            git diff --name-only "${BASE_SHA}" "${{ github.sha }}" \
              | tee /dev/stderr \
              | .github/scripts/select-matrix.sh | tee -a "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.build != '[]'
    runs-on: ubuntu-latest
    # A stuck build is stopped here instead of running to GitHub's six-hour
    # limit. The slowest image (kiwix) takes about 25 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      # aarch64 images are built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Exposes the Actions cache service to the plain `docker buildx` call
      # below, so unchanged layers (base packages, downloads, pip installs)
      # come from the cache instead of being rebuilt on every run. Pull
      # requests read the cache main wrote; each app and arch has its own.
      - uses: crazy-max/ghaction-github-runtime@v3

      # The same two build args the Supervisor passes when it builds an app
      # on the machine it's installed on, with BUILD_FROM taken from the
      # app's own build.yaml - so this proves the real install-time build.
      - name: Build ${{ matrix.app }} for ${{ matrix.arch }}
        run: |
          build_from=$(yq -r '.build_from.${{ matrix.arch }}' "${{ matrix.app }}/build.yaml")
          echo "Building ${{ matrix.app }} for ${{ matrix.arch }} from ${build_from}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM="${build_from}" \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --output type=cacheonly \
            --cache-from type=gha,scope=${{ matrix.app }}-${{ matrix.arch }} \
            --cache-to type=gha,mode=min,scope=${{ matrix.app }}-${{ matrix.arch }},ignore-error=true \
            "${{ matrix.app }}"
