name: Test

# Restricted to the default branch for the same reason as the build
# workflow: a branch with an open pull request would otherwise run every
# job twice, once per event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select affected apps
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.select.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: select
        name: Work out which apps changed
        env:
          # Only a manual run selects everything. A pull request and a push
          # to main both build just the apps their change touched: the pull
          # request already proved those, and rebuilding all the others on
          # every merge cost about an hour of runner time each.
          SELECT_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          # What the change is measured against: the pull request's base,
          # or the commit main pointed at before this push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a manual run, the first push of a branch, or a
          # force push that dropped the old commit): select everything
          # rather than guess.
          if [ "${SELECT_ALL}" != "true" ] \
              && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            SELECT_ALL=true
          fi
          if [ "${SELECT_ALL}" = "true" ]; then
            printf '' | .github/scripts/select-matrix.sh | tee -a "${GITHUB_OUTPUT}"
          else
            git diff --name-only "${BASE_SHA}" "${{ github.sha }}" \
              | tee /dev/stderr \
              | .github/scripts/select-matrix.sh | tee -a "${GITHUB_OUTPUT}"
          fi

  pytest:
    name: Test ${{ matrix.app }}
    needs: select
    if: needs.select.outputs.test != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.select.outputs.test) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        if: matrix.app == 'print_timelapse' || matrix.app == 'youtube_music_sync'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install zbar
        # pyzbar is a ctypes wrapper that needs the zbar shared library at
        # import time. The Docker build installs it via apk (Alpine); this
        # runner needs its own copy for `pytest` to even collect the suite.
        if: matrix.app == 'pantry_tracker'
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Install dependencies
        working-directory: ${{ matrix.app }}/app
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.app }}/app
        run: pytest -v
