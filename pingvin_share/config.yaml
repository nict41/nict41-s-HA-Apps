name: Pingvin Share
version: "1.1.0"
slug: pingvin_share
description: Self-hosted file sharing platform (a WeTransfer alternative), powered by the community-maintained Pingvin Share X image
url: "https://github.com/nict41/nict41-s-HA-Apps/tree/main/pingvin_share"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 20
hassio_api: false
homeassistant_api: false
host_network: false
ports:
  3000/tcp: 8095
ports_description:
  3000/tcp: Pingvin Share web interface
webui: "http://[HOST]:[PORT:3000]/"
map:
  - share:rw
options:
  trust_proxy: true
  clamav_host: ""
  clamav_port: 3310
  config_yaml: ""
schema:
  trust_proxy: bool
  clamav_host: str?
  clamav_port: port
  config_yaml: str?
