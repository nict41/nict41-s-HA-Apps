  notify_hour: 8
  vision_api_base: ""
  vision_api_key: ""
  vision_model: "glm-ocr:latest"
schema:
  notify_service: str
  notify_days_before: int(0,30)
  notify_repeat_hours: int(1,168)
  check_interval_hours: int(1,24)
