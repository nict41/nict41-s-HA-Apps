name: "Pantry Tracker"
version: "0.13.0"
slug: "pantry_tracker"
description: "Scan grocery barcodes to track your pantry, read use-by dates from a photo, and get notified before food expires"
url: "https://github.com/nict41/nict41-s-HA-Apps/tree/main/pantry_tracker"
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
panel_admin: false
