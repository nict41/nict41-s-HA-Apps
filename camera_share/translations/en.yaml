configuration:
  camera_entity:
    name: Camera entity
    description: >-
      The one camera this page shows, e.g.
      camera.centauri_carbon_2_chamber_camera. It is read through Home
      Assistant, never from the printer directly, so the Elegoo
      integration's frame hub stays the only thing connected to the
      printer's camera. No other entity is ever reachable from this app.
  page_title:
    name: Page title
    description: >-
      The heading on the shared page and the browser tab title. Visible to
      everyone you share the link with, so keep it anonymous if the page
      will be public.
  ha_token:
    name: Home Assistant token
    description: >-
      A long-lived access token, created on your Home Assistant profile
      page under Security -> Long-lived access tokens. Required: the camera
      stream is read from Home Assistant directly with it, because the
      Supervisor's API proxy cannot pass a live stream through. A dedicated
      non-admin user for it is a good idea. It never leaves this app.
  core_url:
    name: Home Assistant address
    description: >-
      Leave blank for http://homeassistant:8123. Set it only if Home
      Assistant listens on another port or serves HTTPS.
  fps:
    name: Frames per second
    description: >-
      The most frames each viewer is sent per second. This only affects the
      bandwidth each viewer uses - the printer sees one connection whatever
      it is set to. 20 matches the printer camera; lower it to save
      bandwidth through the tunnel. A ceiling, not a guarantee: the camera
      sets the real rate.
  access_key:
    name: Access key
    description: >-
      A shared secret the page requires before it shows anything. Share the
      link as https://<your hostname>/?key=<access key>; the browser then
      remembers it in a cookie. Leave it blank and anyone who learns the
      hostname can watch the camera, which is rarely what you want for a
      page published through a tunnel.
  max_viewers:
    name: Maximum viewers
    description: >-
      How many people may watch at once. Extra viewers are turned away with
      a "camera busy" page rather than being queued. Note this is purely to
      limit this app's own bandwidth: the printer only ever sees one
      connection no matter how many people are watching.
network:
  8099/tcp: >-
    The public camera page. Whatever host port you set here is what your
    Cloudflare tunnel's public hostname must point at -
    http://<your Home Assistant LAN IP>:<this port> - so read it here rather
    than assuming the default. The app prints the same address in its log at
    startup. Nothing else needs forwarding.
