name: "3D Print Timelapse"
version: "0.5.0"
slug: "print_timelapse"
description: "Captures frame-by-frame 3D print timelapses and archives them as GIFs"
url: "https://github.com/nict41/nict41-s-HA-Apps/tree/main/print_timelapse"
arch:
  - aarch64
  - amd64
init: false
startup: services
ingress: true
ingress_port: 8099
homeassistant_api: true
hassio_api: true
panel_icon: mdi:camera-burst
panel_title: "Print Timelapse"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Timelapse REST API (used by Home Assistant automations) and gallery"
map:
  - media:rw
options:
  cleanup_after_finish: true
  gif_fps: 8
  gif_width: 480
  gif_export_path: ""
schema:
  cleanup_after_finish: bool
  gif_fps: int(1,30)
  gif_width: int(160,1920)
  gif_export_path: str
