show_screen:
  fields:
    screen:
      required: true
      example: doorbell
      selector:
        text:
    seconds:
      example: 30
      selector:
        number: {min: 1, max: 86400, unit_of_measurement: s, mode: box}
    clock: &clock
      example: main
      selector:
        text:
flash_message:
  fields:
    message:
      required: true
      example: "Washing done"
      selector:
        text: {multiline: true}
    seconds:
      default: 10
      selector:
        number: {min: 1, max: 3600, unit_of_measurement: s, mode: box}
    icon:
      example: mdi:washing-machine
      selector:
        icon:
    color:
      example: "#FFC107"
      selector:
        text:
    clock: *clock
pause:
  fields:
    seconds:
      example: 600
      selector:
        number: {min: 1, max: 86400, unit_of_measurement: s, mode: box}
    clock: *clock
resume:
  fields:
    clock: *clock
next_screen:
  fields:
    clock: *clock
set_rotation:
  fields:
    enabled:
      required: true
      selector:
        boolean:
    clock: *clock
