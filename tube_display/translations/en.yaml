configuration:
  clock_host:
    name: Clock host or IP
    description: >-
      Address of the IPSTube clock on the network, e.g. 192.168.8.211
      (no http:// prefix, no port unless it is not 80).
  clock_mqtt_id:
    name: Clock MQTT id
    description: >-
      The <id> in the clock's MQTT topics (clock/<id>/...), shown on the
      clock's web page.
  clock_user:
    name: Clock web login user
    description: >-
      Optional. Username for the clock's HTTP digest auth, if a web login
      is set on the clock.
  clock_password:
    name: Clock web login password
    description: Optional. Password for the clock's HTTP digest auth.
  default_duration:
    name: Default screen duration
    description: >-
      Seconds a screen stays in the rotation when it does not set its own
      duration.
  default_refresh:
    name: Default refresh interval
    description: >-
      Seconds between re-renders of the current screen when it does not set
      its own refresh.
  log_level:
    name: Log level
    description: How much to write to the add-on log.
  screens_file:
    name: Screens file
    description: >-
      Where the screens are defined. Default /homeassistant/tube_display/screens.yaml,
      which is tube_display/screens.yaml in File editor.
  clocks:
    name: More clocks
    description: >-
      Optional. Further IPSTube clocks, each with a short name (letters, digits, _),
      host, MQTT id and optional web login. The clock above is called "main". Give a
      clock its own rotation under `clocks: {<name>: {rotation: [...]}}` in the
      screens file; without one it shows the same rotation.
  firmware_updates:
    name: Offer clock firmware updates
    description: >-
      Check github.com/nict41/HA-Tubes for new HA Tubes releases every 6 hours and
      offer them to the clocks, so Home Assistant shows a firmware update for each
      clock. The app downloads the file and serves it to the clock itself, and stops
      sending screens while a clock updates.
  firmware_variant:
    name: Firmware variant
    description: >-
      Which build of HA Tubes the clocks run (the part after firmware- in the release
      file names). ipstube_ha (the default) for an IPSTube H401/H402 running the Home Assistant-only build, ipstube for the standard build.
  app_url:
    name: App address for the clock
    description: >-
      Optional. How a clock reaches this app's HTTP API, e.g. http://192.168.8.25:8098.
      Leave empty to use the Home Assistant host's address and the host port
      chosen under Network below.
