name: "Tube Display"
version: "0.4.0"
slug: "tube_display"
description: "Renders Home Assistant information into pictures and pushes them to an IPSTube clock's six panel displays"
url: "https://github.com/nict41/nict41-s-HA-Apps/tree/main/tube_display"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: "Tube Display"
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Tube Display HTTP API (used by Home Assistant automations) and screen previews"
map:
  - addon_config:rw
  - homeassistant_config:rw
services:
  - mqtt:need
options:
  clock_host: "192.168.8.211"
  clock_mqtt_id: "209374ipstube"
  clock_user: ""
  clock_password: ""
  default_duration: 15
  default_refresh: 30
  log_level: "info"
  screens_file: "/homeassistant/tube_display/screens.yaml"
schema:
  clock_host: str
  clock_mqtt_id: str
  clock_user: str?
  clock_password: password?
  default_duration: int(3,3600)
  default_refresh: int(2,3600)
  log_level: list(debug|info|warning|error)?
  screens_file: str?
