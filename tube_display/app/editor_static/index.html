<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tube Display</title>
<link rel="stylesheet" href="editor.css?v=__VERSION__">
</head>
<body>
<header class="topbar">
  <span class="brand">Tube Display</span>
  <button id="undoBtn" class="btn" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
  <button id="redoBtn" class="btn" title="Redo (Ctrl+Shift+Z)" disabled>&#8631;</button>
  <button id="saveBtn" class="btn primary" disabled>Save</button>
  <button id="historyBtn" class="btn">History</button>
  <button id="yamlToggle" class="btn">Edit YAML</button>
  <label class="auto-toggle" title="Off: screens only change when you press the clock's button">
    <input type="checkbox" id="autoRotate"> Cycle automatically
  </label>
  <span id="status" class="status"></span>
  <span id="clockChip" class="clock-chip hidden"></span>
  <button id="reloadBtn" class="btn hidden">Reload</button>
</header>

<main id="editorView">
  <aside class="sidebar">
    <section class="card">
      <h2>Rotation</h2>
      <div class="clock-select-row hidden" id="clockSelectRow">
        <label>clock <select id="clockSelect"></select></label>
      </div>
      <ul id="rotationList" class="rotation-list"></ul>
      <div class="clock-row">
        <label><input type="checkbox" id="clockEnabled"> clock</label>
        <input type="number" id="clockDuration" min="1" step="1" title="clock duration (s)">
        <span class="unit">s</span>
      </div>
      <div class="clock-override-row hidden" id="clockOverrideRow">
        <span class="hint" id="clockOverrideHint"></span>
        <button id="clockOverrideBtn" class="btn small"></button>
      </div>
    </section>
    <section class="card" id="nightCard">
      <h2>Night mode</h2>
      <p class="hint">Sets the clock's brightness from the sun's elevation and dims the screens at night.</p>
      <div class="row">
        <label><input type="checkbox" id="nightEnabled"> Dim with the sun</label>
      </div>
      <div id="nightFields" class="hidden">
        <div class="row">
          <label>brightness day <input type="range" id="nightDay" min="10" max="255" step="1"> <span class="unit" id="nightDayVal"></span></label>
        </div>
        <div class="row">
          <label>brightness night <input type="range" id="nightNight" min="10" max="255" step="1"> <span class="unit" id="nightNightVal"></span></label>
        </div>
        <div class="row">
          <label>full day above <input type="number" id="nightAbove" step="0.5" title="sun elevation in degrees"> &deg;</label>
          <label>full night below <input type="number" id="nightBelow" step="0.5" title="sun elevation in degrees"> &deg;</label>
        </div>
        <div class="row">
          <label>dim screens at night <input type="range" id="nightDim" min="20" max="100" step="1"> <span class="unit" id="nightDimVal"></span></label>
        </div>
        <div class="row">
          <label><input type="checkbox" id="nightQuiet"> Quiet hours</label>
        </div>
        <div id="quietFields" class="hidden">
          <div class="row">
            <label>from <input type="time" id="quietFrom"></label>
            <label>to <input type="time" id="quietTo"></label>
            <label><select id="quietMode">
              <option value="clock">show the clock</option>
              <option value="blank">blank tubes</option>
            </select></label>
          </div>
        </div>
      </div>
    </section>
    <section class="card">
      <h2>Screens <button id="addScreen" class="btn small">Add</button></h2>
      <ul id="screenList" class="screen-list"></ul>
    </section>
  </aside>

  <section class="main">
    <div class="card screen-settings">
      <h2 id="screenTitle">Screen</h2>
      <div class="row">
        <label>duration <input type="number" id="scrDuration" min="1" step="1" placeholder="default"></label>
        <label>refresh <input type="number" id="scrRefresh" min="1" step="1" placeholder="default"></label>
        <label>background <input type="color" id="scrBackground" value="#000000"></label>
        <label>layout <select id="scrLayout">
          <option value="tubes">six tubes</option>
          <option value="strip">one picture across all six</option>
        </select></label>
        <label>transition <select id="scrTransition">
          <option value="">default</option>
          <option value="none">none</option>
          <option value="cascade">cascade</option>
          <option value="cascade_right">cascade right</option>
          <option value="center_out">centre out</option>
          <option value="wipe">wipe</option>
        </select></label>
        <label class="wide">when (template, optional) <input type="text" id="scrWhen" placeholder="{{ is_state('...','on') }}"></label>
      </div>
      <div class="row">
        <button id="renameScreen" class="btn small">Rename</button>
        <button id="deleteScreen" class="btn small danger">Delete</button>
      </div>
    </div>

    <div class="card preview-card">
      <div class="preview-head">
        <h2>Preview</h2>
        <button id="mirrorBtn" class="btn small hidden" title="Show this screen on the clock while you edit">Show on clock</button>
        <button id="refreshPreview" class="btn small">Refresh</button>
      </div>
      <div id="tubes" class="tubes"></div>
    </div>

    <div class="card tube-editor hidden" id="tubeEditor">
      <h2 id="tubeTitle">Tube</h2>
      <div class="row" id="tubeTypeRow">
        <label>type
          <select id="tType"></select>
        </label>
        <button id="copyTube" class="btn small">Copy</button>
        <button id="pasteTube" class="btn small">Paste</button>
        <button id="tubeLeft" class="btn small">&#8592;</button>
        <button id="tubeRight" class="btn small">&#8594;</button>
      </div>
      <div id="tubeFields"></div>
    </div>
  </section>
</main>

<main id="yamlView" class="hidden">
  <div class="card yaml-card">
    <div class="row">
      <button id="yamlSave" class="btn primary">Save YAML</button>
      <button id="yamlBack" class="btn">Back to editor</button>
      <span id="yamlStatus" class="status"></span>
    </div>
    <textarea id="yamlText" spellcheck="false"></textarea>
    <ul id="yamlErrors" class="errors"></ul>
  </div>
</main>

<div id="historyModal" class="modal-overlay hidden">
  <div class="card modal-card" role="dialog" aria-label="Save history">
    <div class="modal-head">
      <h2 id="historyTitle">Save history</h2>
      <button id="historyClose" class="btn small" title="Close (Esc)">&times;</button>
    </div>
    <div id="historyListView">
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="hint hidden">No earlier versions yet. A copy is kept every time you save.</p>
      <ul id="historyErrors" class="errors"></ul>
    </div>
    <div id="historyYamlView" class="hidden">
      <pre id="historyYaml" class="yaml-view"></pre>
      <div class="row">
        <button id="historyBack" class="btn">Back</button>
        <button id="historyRestoreYaml" class="btn primary">Restore this version</button>
      </div>
      <ul id="historyYamlErrors" class="errors"></ul>
    </div>
  </div>
</div>

<script src="editor.js?v=__VERSION__"></script>
</body>
</html>
