# Fixture screens file for the editor e2e tests (copied to a temp file per test).
# Four screens: a six-tube screen, a custom tube, a canvas screen and a strip
# screen; three of them in the rotation plus the special "clock" entry.
rotation: [main, custom, strip, clock]
clock: {duration: 60}

screens:
  main:
    duration: 15
    refresh: 30
    background: "#000000"
    tubes:
      - {type: text, text: "Hello tubes", size: 22, color: "#FFFFFF", align: center}
      - {type: ring, value: "{{ states('sensor.cpu_load') | float(0) | round(0) | int }}",
         max: 100, label: "CPU", unit: "%", color: "#4CAF50"}
      - {type: big_number, value: "{{ states('sensor.temperature') | float(0) | round(1) }}",
         unit: "°C", label: "Temp", color: "#FFFFFF"}
      - {type: icon, icon: "mdi:robot", text: "hi", color: "#D97757"}
      - {type: text, text: "line one\nline two", color: "#9e9e9e"}
      - {type: blank}

  custom:
    duration: 10
    tubes:
      - type: custom
        items:
          - {type: text, text: "Custom", x: 67, y: 60, size: 24, color: "#FFFFFF"}
          - {type: ring, value: "42", max: 100, x: 67, y: 160, radius: 40, thickness: 8,
             color: "#D97757"}
      - {type: blank}
      - {type: blank}
      - {type: blank}
      - {type: blank}
      - {type: blank}

  canvas:
    duration: 12
    canvas:
      background: "#101010"
      items:
        - {type: text, text: "Canvas", x: 405, y: 40, size: 30, color: "#FFFFFF"}
        - {type: rect, x: 40, y: 200, width: 730, height: 4, color: "#444444"}
        - {type: icon, icon: "mdi:star", x: 405, y: 150, size: 64, color: "#FFC107"}

  strip:
    strip: {source: "builtin:claude", fit: cover}
