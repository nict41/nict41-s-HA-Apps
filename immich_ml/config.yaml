name: Immich Machine Learning (OpenVINO)
version: "v3.3.1-openvino"
slug: immich_ml
description: "Immich machine-learning sidecar that runs face detection and smart search on an Intel iGPU via OpenVINO"
url: https://github.com/nict41/nict41-s-HA-Apps/tree/main/immich_ml
arch:
  - amd64
init: false
startup: services
boot: auto
watchdog: "http://[HOST]:[PORT:3003]/ping"
video: true
devices:
  - /dev/dri
  - /dev/dri/renderD128
ports:
  3003/tcp: 3003
ports_description:
  3003/tcp: Immich ML REST API - set as a Machine Learning URL in the Immich server's admin settings
options:
  workers: 1
  model_ttl: 300
  worker_timeout: 300
schema:
  workers: int(1,8)
  model_ttl: int(0,86400)
  worker_timeout: int(1,3600)
