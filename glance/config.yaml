name: Glance Dashboard
version: 0.2.2
slug: glance
description: >-
  A self-hosted dashboard that puts all your feeds in one place.
  Glance is a fast, lightweight dashboard with support for RSS, weather,
  bookmarks, calendars, stocks, Twitch, YouTube, Reddit, and more.
url: https://github.com/nict41/nict41-s-HA-Apps/tree/main/glance
arch:
  - amd64
  - aarch64
  - armv7
homeassistant: "2024.1.0"
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: Glance
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Glance web interface (optional direct access)
map:
  - config:rw
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
startup: application
boot: auto
