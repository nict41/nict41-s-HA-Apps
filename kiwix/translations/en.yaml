configuration:
  zim_path:
    name: ZIM storage path
    description: >-
      Where .zim archives are stored, on the network share you mapped into
      Home Assistant as Media storage (Settings -> System -> Storage). Either
      a path relative to /media (e.g. NAS1/Kiwix) or the full path
      (e.g. /media/NAS1/Kiwix). Leave blank and the app will tell you it has
      nowhere to store archives instead of writing to the add-on's own disk.
  library_source:
    name: Library source
    description: >-
      Base URL of the Kiwix catalog to browse. Defaults to the official
      library at https://library.kiwix.org; point it at your own mirror if
      you run one.
  catalog_language:
    name: Default catalog language
    description: >-
      ISO 639-3 language code the catalog is filtered by when the browser
      opens (e.g. eng, fra, deu). You can change the filter in the app at
      any time.
  auto_serve_new:
    name: Serve newly downloaded archives
    description: >-
      Add each finished download to the served library automatically. Turn
      this off to choose what kiwix-serve serves yourself.
  max_concurrent_downloads:
    name: Concurrent downloads
    description: >-
      How many archives may download at once. This is only the starting
      value: change it in the app's Settings panel instead and it applies
      immediately, without restarting the add-on (which would interrupt
      anything in flight).
  download_threads:
    name: Connections per download
    description: >-
      How many parallel connections one archive is fetched over. Splitting a
      download across ranges is usually much faster on a big archive. Also
      changeable live in the app's Settings panel.
  download_window_enabled:
    name: Restrict downloads to off-peak hours
    description: >-
      Only transfer archives between the times below, so a 100 GB download
      isn't competing with everything else on your connection during the day.
      Running transfers pause when the window closes and resume when it
      opens; nothing already downloaded is lost.
  download_window_start:
    name: Off-peak window starts
    description: >-
      24-hour local time (Home Assistant's timezone), e.g. 23:00.
  download_window_end:
    name: Off-peak window ends
    description: >-
      24-hour local time, e.g. 07:00. A window may cross midnight.
