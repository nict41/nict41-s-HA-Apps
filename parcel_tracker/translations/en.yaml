configuration:
  mailboxes:
    name: Mailboxes
    description: One entry per email account to scan for shipping emails.
  mailboxes.host:
    name: IMAP host
    description: Hostname of the mailbox's IMAP server, e.g. imap.gmail.com.
  mailboxes.port:
    name: IMAP port
    description: Usually 993 for IMAP over SSL, or 143 if using STARTTLS.
  mailboxes.use_ssl:
    name: Use SSL
    description: Connect over IMAP SSL (port 993). Turn off to use STARTTLS instead (e.g. port 143).
  mailboxes.username:
    name: IMAP username
    description: Mailbox login, usually the full email address.
  mailboxes.password:
    name: IMAP password
    description: >-
      Mailbox password or an app-specific password. The mailbox is only ever
      read - nothing is deleted or marked as read.
  mailboxes.folder:
    name: IMAP folder
    description: Folder to scan for shipping emails, e.g. INBOX or a dedicated forwarding folder.
  lookback_days:
    name: Lookback window (days)
    description: How far back to scan for shipping emails on each check.
  poll_interval_minutes:
    name: Check interval (minutes)
    description: How often to check the mailboxes and refresh delivery status.
  auto_archive_after_days:
    name: Auto-archive after (days)
    description: Automatically archive delivered parcels this many days after delivery. Set to 0 to disable.
  trusted_senders:
    name: Trusted sender domains
    description: >-
      Comma-separated extra sender domains (e.g. myretailer.com) to treat as
      trusted, enabling the same high-confidence parsing used for AliExpress,
      eBay and Amazon. Applies across all configured mailboxes.
  ignore_senders:
    name: Ignored sender domains
    description: Comma-separated sender domains to skip entirely, e.g. noisy newsletters.
  seventeentrack_api_key:
    name: 17track API key
    description: >-
      Optional. Enables live delivery status lookups via 17track.net. Can be
      configured alongside a Track123 API key - each parcel sticks to
      whichever provider it was first registered with. Without any provider
      configured, parcels still get detected and listed, with carrier
      tracking links only.
  track123_api_key:
    name: Track123 API key
    description: >-
      Optional. Enables live delivery status lookups via track123.com, as an
      alternative or addition to 17track. New parcels are registered with
      whichever configured provider has room first; each then sticks to that
      provider for future refreshes.
