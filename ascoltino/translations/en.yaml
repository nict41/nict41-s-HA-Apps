configuration:
  bot_token:
    name: Telegram Bot Token
    description: Your bot token from @BotFather (required)
  model:
    name: Model
    description: "parakeet-en = NVIDIA Parakeet-TDT v2, English only (fast, most accurate for English). parakeet = Parakeet-TDT v3, 25 European languages. Others are Whisper sizes: larger is more accurate but slower"
  language:
    name: Language Code
    description: Two-letter language code (e.g., en, it, de, es, fr). Used by Whisper; Parakeet models ignore it
  beam_size:
    name: Beam Size
    description: Whisper search beam size (1-10). Higher values may improve accuracy slightly; ignored by Parakeet
  vad_filter:
    name: VAD Filter
    description: Enable Voice Activity Detection to skip silence in audio
  threads:
    name: CPU Threads
    description: CPU threads for transcription (0 = all cores). Use one less than your core count if other add-ons keep the CPU busy
  show_footer:
    name: Show Footer
    description: Show transcription stats (time, model, speed) in message footer
  bot_name:
    name: Bot Name
    description: Optional name displayed in the transcription footer
  admin_chat_id:
    name: Admin Chat ID
    description: Optional Telegram chat ID that gets an alert when a chat that is not allowed sends audio
  allowed_chat_ids:
    name: Allowed Chat IDs
    description: Comma-separated chat IDs allowed to use the bot (groups are negative). Empty = anyone can use it
