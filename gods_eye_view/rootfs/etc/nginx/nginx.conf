worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant's ingress proxies with aiohttp `params=request.query`,
    # which parses the query into a MultiDict and re-encodes it. That round
    # trip rewrites Vite's valueless module markers: `?import&url` arrives as
    # `?import=&url=`, Vite stops recognising it as a `?url` asset import, and
    # serves the raw file where the browser expects a JS module. The module
    # graph then dies on a syntax error and the app never boots.
    #
    # So put the markers back before proxying. One pass strips one marker's
    # `=`, so chain enough passes for the markers Vite actually combines.
    map $args $gev_args_1 {
        default $args;
        "~^(|.*&)(import|url|raw|direct|inline|worker|sharedworker|no-inline|used)=(|&.*)$" "$1$2$3";
    }
    map $gev_args_1 $gev_args_2 {
        default $gev_args_1;
        "~^(|.*&)(import|url|raw|direct|inline|worker|sharedworker|no-inline|used)=(|&.*)$" "$1$2$3";
    }
    map $gev_args_2 $gev_args {
        default $gev_args_2;
        "~^(|.*&)(import|url|raw|direct|inline|worker|sharedworker|no-inline|used)=(|&.*)$" "$1$2$3";
    }

    include /etc/nginx/servers/*.conf;
}
