worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    # This add-on is reached three ways: on its own port, through Home
    # Assistant's ingress, and through a tunnel that terminates TLS elsewhere
    # and never publishes the port. nginx's default is to expand a relative
    # redirect using its OWN scheme, host and port, which is wrong for two of
    # those three — a tunnelled client gets sent to http://host:8037/, a port
    # and scheme that do not exist for it. Keep redirects relative and let the
    # browser resolve them against wherever it actually is.
    absolute_redirect off;

    # A tunnel terminates TLS upstream, so the listener's own scheme is http
    # even when the client is on https. The session cookie's Secure flag has to
    # follow the client's protocol, not ours.
    map $http_x_forwarded_proto $gev_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant's ingress proxies with aiohttp `params=request.query`,
    # which parses the query into a MultiDict and re-encodes it. That round
    # trip rewrites Vite's valueless module markers: `?import&url` arrives as
    # `?import=&url=`, Vite stops recognising it as a `?url` asset import, and
    # serves the raw file where the browser expects a JS module. The module
    # graph then dies on a syntax error and the app never boots.
    #
    # So put the markers back before proxying. One pass strips one marker's
    # `=`, so chain enough passes for the markers Vite actually combines.
    map $args $gev_args_1 {
        default $args;
        "~^(|.*&)(import|url|raw|direct|inline|worker|sharedworker|no-inline|used)=(|&.*)$" "$1$2$3";
    }
    map $gev_args_1 $gev_args_2 {
        default $gev_args_1;
        "~^(|.*&)(import|url|raw|direct|inline|worker|sharedworker|no-inline|used)=(|&.*)$" "$1$2$3";
    }
    map $gev_args_2 $gev_args {
        default $gev_args_2;
        "~^(|.*&)(import|url|raw|direct|inline|worker|sharedworker|no-inline|used)=(|&.*)$" "$1$2$3";
    }

    include /etc/nginx/servers/*.conf;
}
