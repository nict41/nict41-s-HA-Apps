proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Globe tiles and the AIS feed stream for as long as the tab is open.
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# The dev server sends `X-Frame-Options: DENY` and `frame-ancestors 'none'` to
# keep its credential panel out of a hostile frame. Ingress renders the add-on
# inside Home Assistant's own same-origin iframe, so re-scope the two headers
# rather than dropping the protection: cross-origin framing stays blocked.
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
