proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# ── Why the app is addressed as loopback, not as the client addressed us ──────
# Upstream gates its cost-bearing routes on three request properties, and every
# one of them fails if we forward the client's view of the world:
#
#   * Host. `HOST=0.0.0.0` used to switch Vite's allowedHosts to "any host".
#     Since upstream 0.2.1 it does not, and the `.local` suffix is no longer
#     accepted by default either — so a forwarded `Host: homeassistant.local`
#     is refused with "Blocked request. This host is not allowed." IP
#     addresses and `localhost` are always allowed, so we present one.
#   * Origin. The gate requires Origin to equal the authority it computes from
#     its OWN protocol and Host. This hop is plain http, so a client on https
#     could never match, whatever Host we forwarded.
#   * Forwarding headers. `X-Forwarded-For`, `X-Real-IP`, `X-Forwarded-Proto`,
#     `Forwarded`, `Via` and Cloudflare's `CF-Connecting-IP`/`CF-Ray` are read
#     as proof that the request came from somewhere else and answered with 403.
#     None of them is sent, and the list is cleared rather than merely not set:
#     nginx passes on an unknown request header verbatim, so a tunnel that adds
#     its own (Cloudflare does) would otherwise trip the gate, as would a
#     client that sent one deliberately.
#
# Without this, /api/google/*, /api/openai/*, /api/realtime/* and the whole
# new Street Level layer (/api/mapillary/*) answer 403.
#
# This gives up no protection that was in place before. The app listens on
# loopback inside this container and nginx is its only caller, so the Host it
# sees was never a boundary here — it was `allowedHosts: true` until upstream
# 0.2.1. The boundary is the pair of listeners: ingress is authenticated by
# Home Assistant, and the published port carries the optional login. The two
# surfaces a loopback Host would otherwise unlock, Provider Settings and /mcp,
# are refused in locations.conf instead.
proxy_set_header Host "127.0.0.1:4173";
proxy_set_header Origin "http://127.0.0.1:4173";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_set_header Via "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-Ray "";

# Globe tiles and the AIS feed stream for as long as the tab is open.
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# The dev server sends `X-Frame-Options: DENY` and `frame-ancestors 'none'` to
# keep its credential panel out of a hostile frame. Ingress renders the add-on
# inside Home Assistant's own same-origin iframe, so re-scope the two headers
# rather than dropping the protection: cross-origin framing stays blocked.
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
